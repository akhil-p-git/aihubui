[package]
name = "aihubui"
version = "0.1.0"
edition = "2024"
description = "A terminal client for the aihub web chat's HTTP API"

[dependencies]
anyhow = "1.0.104"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
unicode-width = "0.2.3"
